name: Bug 报告 / Bug report
description: 报告可复现的功能、音频、驱动、安装或界面问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请搜索现有 Issue。安全漏洞不要在这里公开，请阅读 SECURITY.md。
        请移除 API Key、令牌、个人路径、会议内容和其他敏感信息。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
        - label: 我已从日志和截图中移除凭据及个人信息。
          required: true
  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      options:
        - Desktop UI / 字幕悬浮窗
        - Tauri / Rust 音频运行时
        - Native Bridge
        - Windows 虚拟音频驱动
        - 安装、卸载或修复脚本
        - Provider / 实时模型接口
        - Watch Mode / 测试与质量门禁
        - 文档或多语言资源
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 发布版本、Git 提交 SHA 或分支名称。
      placeholder: 例如 v0.1.0 或 f2b53b0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - 不适用 / CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: CPU 架构、音频设备、Node/Rust/WDK 版本、Provider 与模型；只填写与问题有关的内容。
      placeholder: |
        架构: x64
        音频设备: ...
        Node/Rust: ...
        Provider/模型: ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动...
        2. 选择...
        3. 执行...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与证据
      description: 粘贴最小且已脱敏的日志、错误码、截图或诊断导出摘要。长文件可拖拽上传。
      render: text
  - type: textarea
    id: regression
    attributes:
      label: 回归信息与补充说明
      description: 以前是否正常、首次出现在哪个版本、临时规避方法及其他上下文。
