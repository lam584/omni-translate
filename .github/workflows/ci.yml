name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    name: Windows quality baseline
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop test and release configuration
        run: npm run test:contracts

      - name: Audit Rust dead-code exemptions
        run: npm run audit:dead-code

      - name: Run automated quality gate
        run: npm run quality:gate:auto -- -SkipDesktopShell

      - name: Test desktop shell
        run: npm run test:desktop-shell

      - name: Test watch-mode reports
        run: npm run test:watch-mode-report
