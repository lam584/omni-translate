name: PR Fast Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast signal subset
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop (lint + check + test + build)
        run: npm run verify:desktop

      # coverage:gate also measures the Rust side with cargo-llvm-cov, which is
      # pinned to nightly-2026-06-01. Install the exact toolchain explicitly so
      # the gate cannot silently diverge from local runs.
      - name: Bootstrap coverage tooling (nightly-2026-06-01 + cargo-llvm-cov)
        run: npm run coverage:tooling

      # The frontend coverage thresholds previously lived only in local runs,
      # so the gate could rot without anyone noticing. Same thresholds, now on
      # every PR.
      - name: Frontend coverage gate
        run: npm run coverage:gate

      - name: Verify contracts
        run: npm run test:contracts

      - name: Test desktop shell
        run: npm run test:desktop-shell

      - name: Test benchmark core
        run: npm run test:benchmark-core

      - name: Test diagnostic benchmark CLI
        run: npm run test:diagnostics-benchmark

      # The native bridge previously only got cargo *check* on PRs while its
      # sidecar integration tests ran nowhere in CI.
      - name: Test native bridge
        run: npm run test:bridge-service-native

      - name: Bridge contract integration tests
        run: npm run test:integration:bridge-contract

      # The gate/report tooling is executable code too; its own node:test
      # suites used to run only on developer machines. One step per suite so a
      # failing suite cannot be masked by a later command's exit code.
      - name: Node tooling self-tests (watch-mode report)
        run: npm run test:watch-mode-report

      - name: Node tooling self-tests (release lib)
        run: npm run test:release-lib

      - name: Node tooling self-tests (quality gate)
        run: npm run test:quality-gate-tooling

      - name: Node tooling self-tests (startup readiness)
        run: npm run test:startup-readiness

      - name: PowerShell tooling and boundary tests
        run: npm run test:powershell-tooling

      # Pure-Node driver boundary tests had no CI carrier at all.
      - name: Driver boundary tests
        run: npm run test:driver-boundaries

      - name: Audit architecture boundaries
        run: npm run audit:architecture

      - name: Audit PowerShell boundaries
        run: npm run audit:powershell-boundaries
