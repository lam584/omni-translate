name: PR Fast Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-checks:
    name: Fast signal subset
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop (lint + check + test + build)
        run: npm run verify:desktop

      - name: Verify contracts
        run: npm run test:contracts

      - name: Test desktop shell
        run: npm run test:desktop-shell
