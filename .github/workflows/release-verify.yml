name: Release Verify

on:
  workflow_dispatch:
    inputs:
      sync_live_metadata:
        description: "Perform active pre-release sync of Bailian model metadata"
        required: false
        default: true
        type: boolean

jobs:
  pre-release-sync:
    name: Pre-release official Bailian metadata sync
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Actively sync Bailian model metadata with credential
        shell: pwsh
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if ($env:DASHSCOPE_API_KEY) {
            npm run sync:bailian-models
          } elseif ('${{ github.event.inputs.sync_live_metadata }}' -eq 'true') {
            throw 'DASHSCOPE_API_KEY secret is required for active pre-release live Bailian metadata sync.'
          } else {
            npm run verify:bailian-models
          }

      - name: Archive synced Bailian model metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bailian-model-metadata
          path: contracts/bailian-model-metadata.generated.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Windows release static verification
    needs: pre-release-sync
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download synced Bailian model metadata artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bailian-model-metadata
          path: contracts

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release baseline
        env:
          # This workflow is the static verifier and does not build a release
          # shell or install WebDriver. verify-release prints a loud skip
          # banner; the real smoke remains mandatory for local release runs.
          OMNI_SKIP_DRIVER_SMOKE: '1'
        run: node ./scripts/release/verify-release.mjs

      - name: Verify contracts
        run: npm run test:contracts

      - name: Verify Bailian model metadata baseline
        run: npm run verify:bailian-models

      - name: Test Bailian model metadata offline tooling
        run: npm run test:bailian-models

      - name: Test watch-mode report tooling
        run: npm run test:watch-mode-report

      - name: Build, link, and run WebRTC AEC3 release fixtures
        run: npm run test:aec3-msvc

      # Full cargo tests, not just `cargo check`: a release verifier that only
      # type-checks the Rust side gives false confidence.
      - name: Test desktop shell
        run: npm run test:desktop-shell

      - name: Test native bridge
        run: npm run test:bridge-service-native

      - name: Ensure installer layout script is native-only
        shell: pwsh
        run: |
          $content = Get-Content -Raw -LiteralPath scripts/release/prepare-installer-layout.mjs
          $legacyBridgeName = ('bridge', 'service') -join '-'
          $legacyPathPattern = 'path\.join\([''"]apps[''"],\s*[''"]' + [regex]::Escape($legacyBridgeName) + '[''"]\)'
          $legacyDistToken = ('bridge', 'Dist') -join ''
          $legacyPackageToken = ('bridge', 'Package') -join ''
          if ($content -match $legacyPathPattern -or $content.Contains($legacyDistToken) -or $content.Contains($legacyPackageToken)) {
            throw 'Installer layout script still references the removed legacy bridge.'
          }
