name: Release Verify

on:
  workflow_dispatch:

jobs:
  verify:
    name: Windows release static verification
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release baseline
        env:
          # This workflow is the static verifier and does not build a release
          # shell or install WebDriver. verify-release prints a loud skip
          # banner; the real smoke remains mandatory for local release runs.
          OMNI_SKIP_DRIVER_SMOKE: '1'
        run: node ./scripts/release/verify-release.mjs

      - name: Verify contracts
        run: npm run test:contracts

      - name: Test watch-mode report tooling
        run: npm run test:watch-mode-report

      - name: Build, link, and run WebRTC AEC3 release fixtures
        run: npm run test:aec3-msvc

      # Full cargo tests, not just `cargo check`: a release verifier that only
      # type-checks the Rust side gives false confidence.
      - name: Test desktop shell
        run: npm run test:desktop-shell

      - name: Test native bridge
        run: npm run test:bridge-service-native

      - name: Ensure installer layout script is native-only
        shell: pwsh
        run: |
          $content = Get-Content -Raw -LiteralPath scripts/release/prepare-installer-layout.mjs
          $legacyBridgeName = ('bridge', 'service') -join '-'
          $legacyPathPattern = 'path\.join\([''"]apps[''"],\s*[''"]' + [regex]::Escape($legacyBridgeName) + '[''"]\)'
          $legacyDistToken = ('bridge', 'Dist') -join ''
          $legacyPackageToken = ('bridge', 'Package') -join ''
          if ($content -match $legacyPathPattern -or $content.Contains($legacyDistToken) -or $content.Contains($legacyPackageToken)) {
            throw 'Installer layout script still references the removed legacy bridge.'
          }
