[workspace]
resolver = "2"
members = [
  "apps/bridge-service-native",
  "apps/desktop/src-tauri",
  "crates/omni-audio-dsp",
  "crates/omni-bridge-protocol",
  "crates/omni-logging",
]
# Standalone diagnostic tools keep their own lockfiles and target directories.
# Without this exclude, cargo's workspace discovery rejects building them in place
# ("current package believes it's in a workspace when it's not").
exclude = [
  "scripts/diagnostics/credential-write",
  "scripts/diagnostics/omni-benchmark",
  "scripts/diagnostics/omni-realtime",
]
