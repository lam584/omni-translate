[package]
name = "omni-bridge-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
cpal = "0.17.3"
minimp3 = "0.6"
omni-bridge-protocol = { path = "../../crates/omni-bridge-protocol" }
omni-logging = { path = "../../crates/omni-logging" }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.23.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.14.0"
