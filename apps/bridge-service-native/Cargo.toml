[package]
name = "omni-bridge-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
chrono = "0.4"
omni-audio-dsp = { path = "../../crates/omni-audio-dsp" }
omni-bridge-protocol = { path = "../../crates/omni-bridge-protocol" }
omni-logging = { path = "../../crates/omni-logging" }
# rodio re-exports cpal as `rodio::cpal`; keep cpal transitive so its version is
# pinned by rodio. Do NOT re-add a direct cpal dependency: dependabot would bump
# it past the copy rodio links (rodio <= 0.22 links cpal 0.17 only) and split
# the graph. When rodio 0.23 (cpal 0.18) ships, migrate the `id().1` device-id
# accesses to the `.id()` accessor (windows/playback.rs x4,
# tests/windows_sidecar.rs), keeping resolved IDs as bare WASAPI endpoint
# strings — that form is the cross-process contract with the desktop shell.
rodio = { version = "0.22.2", default-features = false, features = ["mp3", "playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
wasapi = "0.23.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3.14.0"

[lints.rust]
unreachable_pub = "warn"
