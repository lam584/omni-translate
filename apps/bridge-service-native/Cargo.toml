[package]
name = "omni-bridge-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
chrono = "0.4"
cpal = "0.18.2"
omni-audio-dsp = { path = "../../crates/omni-audio-dsp" }
omni-bridge-protocol = { path = "../../crates/omni-bridge-protocol" }
omni-logging = { path = "../../crates/omni-logging" }
rodio = { version = "0.22.2", default-features = false, features = ["mp3", "playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
wasapi = "0.23.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3.14.0"

[lints.rust]
unreachable_pub = "warn"
