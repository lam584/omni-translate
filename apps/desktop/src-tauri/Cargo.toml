[package]
name = "omni-desktop-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
omni-bridge-protocol = { path = "../../../crates/omni-bridge-protocol" }
omni-logging = { path = "../../../crates/omni-logging" }
cpal = "0.17.3"
hound = "3.5.1"
keyring = "4"
log = "0.4"
base64 = "0.22.1"
minimp3 = "0.6.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4", "v7"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
wasapi = "0.23.0"
whatlang = "0.18"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[lints.rust]
unreachable_pub = "warn"
