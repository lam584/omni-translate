[package]
name = "omni-benchmark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
minimp3 = "0.6"
omni-benchmark-core = { path = "../../../crates/omni-benchmark-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
