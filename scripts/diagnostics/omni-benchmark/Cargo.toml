[package]
name = "omni-benchmark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
minimp3 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
